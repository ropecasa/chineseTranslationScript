<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font-family: monospace; padding: 12px; background: #121212; color: #fff; }
    input, button { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; border-radius: 4px; }
    button { background: #00adb5; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    #subtitles { height: 180px; overflow-y: auto; background: #1e1e1e; padding: 8px; font-size: 12px; white-space: pre-wrap; border: 1px solid #333; }
  </style>
</head>
<body>
  <input type="password" id="apiKey" placeholder="Gemini API Key">
  <button id="startBtn">Iniciar Subtitulado</button>
  <div id="subtitles">Esperando audio...</div>
  <script src="popup.js"></script>
</body>
</html>
