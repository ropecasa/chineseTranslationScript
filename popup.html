<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; padding: 16px; background-color: #1a1a1a; color: #fff; family: sans-serif; }
    label { display: block; font-size: 12px; margin-bottom: 6px; color: #ccc; font-weight: bold; }
    input { width: 100%; height: 38px; padding: 10px; background-color: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }
    button { width: 100%; height: 38px; background-color: #00adb5; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    p { font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <label for="apiKey">Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="Pega tu clave (AIza...)" autocomplete="off">
  <button id="startBtn">Iniciar en esta pestaña</button>
  <p>La clave solo se usará durante esta sesión y no se guardará en disco.</p>
  <script src="popup.js"></script>
</body>
</html>
